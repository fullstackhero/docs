<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0d;
    --fg: #f1ede4;
    --muted: #a39c8f;
    --border: #2a2c33;
    --green-bright: #22c55e;
    --display: 'Outfit', system-ui, sans-serif;
    --body: 'Figtree', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 675px; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .canvas { --accent: {{ACCENT}}; position: relative; width: 1200px; height: 675px; overflow: hidden; background: var(--bg); }

  .glow {
    position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%);
    width: 900px; height: 540px;
    background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%);
    filter: blur(6px);
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(241, 237, 228, 0.06) 1px, transparent 0);
    background-size: 30px 30px;
    -webkit-mask-image: radial-gradient(80% 74% at 50% 42%, black, transparent 76%);
            mask-image: radial-gradient(80% 74% at 50% 42%, black, transparent 76%);
  }
  .vignette { position: absolute; inset: 0; background: radial-gradient(125% 120% at 50% 0%, transparent 52%, rgba(0, 0, 0, 0.6)); }

  .stack {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 80px; text-align: center;
  }

  .brand { display: inline-flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .brand img { width: 48px; height: 48px; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5)); }
  .brand .name {
    font-family: var(--display); font-weight: 300; font-size: 27px;
    letter-spacing: -0.03em; color: var(--fg);
  }
  .brand .name .accent { color: #16a34a; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 13px; font-weight: 600;
    letter-spacing: 0.26em; text-transform: uppercase;
  }
  .eyebrow .dot {
    width: 7px; height: 7px; border-radius: 999px;
    background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .eyebrow .label { color: var(--muted); }
  .eyebrow .badge {
    font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
    color: var(--accent); padding: 4px 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 32%, transparent);
  }

  .title {
    margin-top: 20px;
    font-family: var(--display); font-weight: 500;
    font-size: {{TITLE_SIZE}}px; line-height: 1.04; letter-spacing: -0.035em;
    color: var(--fg); max-width: 1040px;
  }

  .desc {
    margin-top: 22px; max-width: 760px;
    font-size: 22px; line-height: 1.45; font-weight: 500; color: var(--muted);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="vignette"></div>

    <div class="stack">
      <div class="brand">
        <img src="{{LOGO_SRC}}" alt="" />
        <span class="name">fullstack<span class="accent">hero</span></span>
      </div>
      <span class="eyebrow">
        <span class="dot"></span>
        <span class="label">{{EYEBROW}}</span>
        <span class="badge">{{BADGE}}</span>
      </span>
      <h1 class="title" style="font-size:{{TITLE_SIZE}}px">{{TITLE}}</h1>
      <p class="desc">{{DESC}}</p>
    </div>
  </div>
</body>
</html>
