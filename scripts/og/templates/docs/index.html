<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;600;700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0d;
    --fg: #f1ede4;
    --muted: #a39c8f;
    --border: #2a2c33;
    --green: #16a34a;
    --green-bright: #22c55e;
    --green-deep: #15803d;
    --display: 'Outfit', system-ui, sans-serif;
    --body: 'Figtree', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .canvas { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }

  /* Atmospheric background */
  .glow {
    position: absolute; left: 50%; top: 33%; transform: translate(-50%, -50%);
    width: 900px; height: 560px;
    background: radial-gradient(ellipse at center, rgba(34, 197, 94, 0.22), rgba(21, 128, 61, 0.10) 38%, transparent 70%);
    filter: blur(6px);
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(241, 237, 228, 0.06) 1px, transparent 0);
    background-size: 30px 30px;
    -webkit-mask-image: radial-gradient(78% 72% at 50% 38%, black, transparent 75%);
            mask-image: radial-gradient(78% 72% at 50% 38%, black, transparent 75%);
  }
  .vignette { position: absolute; inset: 0; background: radial-gradient(125% 120% at 50% 0%, transparent 52%, rgba(0, 0, 0, 0.6)); }

  /* Centered lockup */
  .stack {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 64px; text-align: center;
  }
  .logo { position: relative; width: 220px; height: 220px; }
  .logo::before {
    content: ""; position: absolute; inset: -64px;
    background: radial-gradient(circle, rgba(34, 197, 94, 0.34), transparent 68%);
    filter: blur(8px); z-index: 0;
  }
  .logo img {
    position: relative; z-index: 1; width: 220px; height: 220px;
    filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.5));
  }

  .wordmark {
    margin-top: 26px;
    font-family: var(--display); font-weight: 300;
    font-size: 100px; line-height: 0.95; letter-spacing: -0.05em; color: var(--fg);
  }
  .wordmark .accent {
    background: linear-gradient(180deg, #34d36b, #15803d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    /* background-clip:text trims the last glyph's right bearing under tight
       letter-spacing; pad the paint box and cancel the layout shift. */
    padding-right: 0.12em; margin-right: -0.12em;
  }

  .tagline {
    margin-top: 24px; max-width: 740px;
    font-size: 23px; line-height: 1.45; font-weight: 500; color: var(--muted);
  }
  .tagline b { color: var(--fg); font-weight: 600; }

  .foot {
    position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 14px;
    font-family: var(--mono); font-size: 14px; letter-spacing: 0.14em;
    color: var(--muted);
  }
  .foot .tick { width: 20px; height: 1px; background: var(--border); }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="vignette"></div>

    <div class="stack">
      <div class="logo"><img src="../../../../public/logo-fullstackhero.png" alt="fullstackhero" /></div>
      <h1 class="wordmark">fullstack<span class="accent">hero</span></h1>
      <p class="tagline"><b>.NET 10 + React starter kit.</b> Modular monolith, vertical slice, multitenant - production-ready and MIT licensed.</p>
    </div>

    <div class="foot"><span class="tick"></span>fullstackhero.net<span class="tick"></span></div>
  </div>
</body>
</html>
